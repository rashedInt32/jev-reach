<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Settings</title>
  </head>
  <body>
    <h1>Settings</h1>
    <p>Notification preferences.</p>
    <label><input type="checkbox" id="email-notifications" /> Email notifications</label>
    <button id="save">Save</button>
    <a href="/">Back home</a>
    <script>
      console.log("settings-loaded");
      fetch("/api/settings.json").then((r) => r.json()).then((s) => console.log("settings-fetched:" + s.plan));
      document.getElementById("save").addEventListener("click", () => console.error("save-failed: server said no"));
    </script>
  </body>
</html>
